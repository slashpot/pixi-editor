<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixi-ui-editor demo</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #17121f;
      }

      /* like the scene's red button; bottom left, clear of the editor's panels */
      .close-editor {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 2147483647;
        padding: 6px 20px 8px;
        font:
          700 22px 'Pixelify Sans',
          monospace;
        color: #fff;
        text-shadow: 0 2px 0 rgb(0 0 0 / 0.5);
        background: #fe5f55;
        border: 0;
        border-radius: 8px;
        box-shadow: 0 4px 0 #a3332c;
        cursor: pointer;
      }
      .close-editor:hover {
        filter: brightness(1.1);
      }
      .close-editor:active {
        transform: translateY(4px);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
